[default]
# --- Move cursor ---
"C-f" = "forward-char"
"C-b" = "backward-char"
"C-n" = "next-line"
"C-p" = "previous-line"

"C-a" = "beginning-of-line"
"C-e" = "end-of-line"

"C-," = "beginning-of-buffer"
"C-." = "end-of-buffer"

"M-f" = "forward-word"
"M-b" = "backward-word"

"C-v" = "scroll-down"
"M-v" = "scroll-up"

# --- Special ---
"C-Space" = "set-mark"
"C-g" = "keyboard-quit"
