[package]
name = "rusteymacs"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2"
dirs = "5"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
