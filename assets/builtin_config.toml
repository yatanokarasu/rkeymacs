[default]
# --- Move cursor ---
"C-f" = "forward-char"
"C-b" = "backward-char"
"C-n" = "next-line"
"C-p" = "previous-line"

"C-a" = "beginning-of-line"
"C-e" = "end-of-line"

"C-," = "beginning-of-buffer"
"C-." = "end-of-buffer"

"M-f" = "forward-word"
"M-b" = "backward-word"

"C-v" = "scroll-down"
"M-v" = "scroll-up"

# --- Search and replace ---
"C-r" = "isearch-backward"
"C-s" = "isearch-forward"

# --- Edit ---
"C-h" = "delete-backward-char"
"C-d" = "delete-char"

"M-h" = "backward-kill-word"
"M-d" = "kill-word"

"C-k" = "kill-line"
"C-w" = "kill-region"
"M-w" = "kill-ring-save"

"C-y" = "yank"

# --- Error recovery ---
"C-g" = "keyboard-quit"
"C-/" = "undo"

# --- Special ---
"C-Space" = "set-mark"
"C-q" = "toggle-rkeymacs"
